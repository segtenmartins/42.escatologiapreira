MO sobe, Ap 6:16 mostra QUANDO não pode mais estar aqui.",color:"#e85d04"},{ref:"Ap 4:2 a 6:15",title:"IGREJA NO CÉU, MUNDO SEM ELA",text:"No céu, 24 anciãos já coroados representam a Igreja glorificada. Na terra, o mundo sem a Noiva. Entra o anticristo, falsos acordos de paz, engano. O céu celebra, a terra se perde.",color:"#2b9348"},{ref:"Ap 6:9 a 7:17",title:"A MULTIDÃO INUMERÁVEL - Primeira Foto da Família Reunida",text:`Logo após o terror de Ap 6:17 - chegou o dia da sua ira - o capítulo 7 abre como um parêntese de misericórdia. João vê 144 mil judeus selados para ficarem na terra e logo depois uma multidão que ninguém podia contar, de todas as nações, com palmas e vestes brancas - Ap 7:9. A pergunta do Ancião em 7:13 é proposital: Quem são esses? E a resposta em 7:14 define: Estes são os que vêm da grande tribulação e lavaram suas vestes no sangue do Cordeiro.

O Encaixe Pré-Ira Harmônico: Essa cena não é só a Igreja, e não é só mártir. É a primeira foto da Esposa já reunida no céu. Nela estão os que foram arrebatados em Ap 4:1 antes da Ira, mais os que se converteram entre Ap 4 e Ap 6:15 e foram mortos por não aceitarem a marca. Prova? Mesma veste - stolē leukē. É o mesmo linho fino - byssinon - de Ap 19:8. Deus não costura roupa diferente para salvos. Se a roupa é a mesma, o sangue é o mesmo, a família é a mesma. Lavada no mesmo sangue, com o mesmo destino: são a Esposa do Marido de Ap 21. Ap 7 é Deus mostrando para João, antes das trombetas da Ira em Ap 8, que seu povo já está seguro em casa.`,color:"#d90429"},{ref:"Ap 6:16-17",title:"COMEÇA A IRA DE DEUS",text:"Pela primeira vez os homens na terra dizem: Chegou a Ira do Cordeiro. Agora não é mais perseguição de homem contra cristão. É Deus mesmo julgando. A Noiva já está guardada da hora.",color:"#0077b6"},{ref:"Ap 8 a 16",title:"TROMBETAS E TAÇAS",text:"Deus derrama juízos justos. Trombetas alertam, taças finalizam. É pesado ler, mas mostra que Deus leva o pecado a sério. Ele não ignora o mal. Ele julga para salvar quem ainda ouvir.",color:"#ffb703"},{ref:"Ap 17-18",title:"QUEDA DA BABILÔNIA",text:"Cai o sistema religioso, político e econômico que se vendeu. Dinheiro, prazer e poder que pareciam eternos viram fumaça em uma hora. Quem construiu a vida sobre isso perde tudo.",color:"#9d4edd"},{ref:"Ap 19:7-10",title:"BODAS NO CÉU",text:"No céu, festa. Vindas são as bodas do Cordeiro. A Noiva que sofreu com o Noivo agora se alegra. É a cerimônia representante. O Noivo honra quem caminhou com Ele na terra.",color:"#fb5607"},{ref:"Ap 19:11-21",title:"VOLTA COM A NOIVA",text:"Jesus volta montado no cavalo branco, e a Noiva volta com Ele. Ele pisa o lagar da ira sozinho. Justiça final sobre o anticristo e os exércitos rebeldes. O Noivo volta como Rei.",color:"#06d6a0"},{ref:"Ap 20:1-10",title:"MIL ANOS DE PAZ",text:"Satanás preso por mil anos. Cristo reina com os santos. É u
